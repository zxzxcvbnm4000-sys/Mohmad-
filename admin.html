<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>لوحة الإدارة - Free Neet</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #080d1a;
      --glass: rgba(255,255,255,0.05);
      --glass-b: rgba(255,255,255,0.11);
      --glass-h: rgba(255,255,255,0.09);
      --acc: #6366f1;
      --acc2: #818cf8;
      --green: #22c55e;
      --red: #ef4444;
      --yellow: #f59e0b;
      --blue: #3b82f6;
      --txt: #ffffff;
      --txt2: rgba(255,255,255,0.68);
      --txt3: rgba(255,255,255,0.4);
      --r: 16px;
      --tr: all 0.25s cubic-bezier(.4,0,.2,1);
    }

    body {
      font-family: 'Segoe UI','Arial',sans-serif;
      background: var(--bg);
      background-image:
        radial-gradient(ellipse at 10% 10%, rgba(99,102,241,0.18) 0%, transparent 55%),
        radial-gradient(ellipse at 90% 90%, rgba(129,140,248,0.10) 0%, transparent 55%);
      min-height: 100vh;
      color: var(--txt);
      direction: rtl;
    }

    /* ========== LOGIN SCREEN ========== */
    #loginScreen {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .login-box {
      background: rgba(255,255,255,0.06);
      border: 1.5px solid var(--glass-b);
      backdrop-filter: blur(20px);
      border-radius: 24px;
      padding: 44px 36px;
      width: 100%;
      max-width: 400px;
      text-align: center;
      box-shadow: 0 24px 70px rgba(0,0,0,0.4), 0 0 40px rgba(99,102,241,0.1);
      animation: fadeUp .4s ease;
    }

    @keyframes fadeUp {
      from { opacity:0; transform:translateY(24px); }
      to   { opacity:1; transform:translateY(0); }
    }

    .login-icon {
      width: 72px; height: 72px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--acc), var(--acc2));
      display: flex; align-items: center; justify-content: center;
      font-size: 2rem;
      margin: 0 auto 20px;
      box-shadow: 0 0 40px rgba(99,102,241,0.4);
    }

    .login-box h1 {
      font-size: 1.6rem; font-weight: 800;
      background: linear-gradient(135deg, var(--acc2), #c4b5fd);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 6px;
    }

    .login-box p { color: var(--txt2); font-size: .9rem; margin-bottom: 28px; }

    .l-field { margin-bottom: 16px; text-align: right; }
    .l-field label { display:block; font-size:.82rem; color:var(--txt2); margin-bottom:6px; font-weight:500; }
    .l-field input {
      width: 100%;
      background: rgba(255,255,255,0.07);
      border: 1.5px solid var(--glass-b);
      border-radius: 10px;
      padding: 12px 14px;
      color: #fff;
      font-size: 1rem;
      font-family: inherit;
      outline: none;
      transition: var(--tr);
    }
    .l-field input:focus {
      border-color: var(--acc);
      box-shadow: 0 0 0 3px rgba(99,102,241,0.2);
    }

    .login-err {
      color: #ff6b6b;
      font-size: .85rem;
      margin-bottom: 14px;
      min-height: 20px;
    }

    .btn-login {
      width: 100%;
      padding: 13px;
      border: none;
      border-radius: 10px;
      background: linear-gradient(135deg, var(--acc), var(--acc2));
      color: #fff;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      font-family: inherit;
      transition: var(--tr);
      box-shadow: 0 4px 18px rgba(99,102,241,0.35);
    }
    .btn-login:hover { filter:brightness(1.1); transform:translateY(-1px); }

    /* ========== DASHBOARD ========== */
    #dashboard { display: none; }

    .dash-header {
      background: rgba(255,255,255,0.04);
      border-bottom: 1px solid var(--glass-b);
      padding: 14px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      position: sticky;
      top: 0;
      z-index: 100;
      backdrop-filter: blur(16px);
    }

    .dash-header .logo {
      display: flex; align-items: center; gap: 10px;
      font-size: 1.15rem; font-weight: 700;
    }

    .dash-header .logo span {
      background: linear-gradient(135deg, var(--acc2), #c4b5fd);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
    }

    .btn-logout {
      padding: 8px 20px;
      border: 1.5px solid rgba(239,68,68,0.4);
      border-radius: 50px;
      background: rgba(239,68,68,0.1);
      color: #fca5a5;
      font-size: .85rem;
      font-weight: 600;
      cursor: pointer;
      font-family: inherit;
      transition: var(--tr);
    }
    .btn-logout:hover { background: rgba(239,68,68,0.25); }

    .dash-body { max-width: 1100px; margin: 0 auto; padding: 28px 20px 60px; }

    /* ========== STATS ========== */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 14px;
      margin-bottom: 32px;
    }

    .stat-card {
      background: var(--glass);
      border: 1.5px solid var(--glass-b);
      border-radius: var(--r);
      padding: 18px 16px;
      text-align: center;
      backdrop-filter: blur(12px);
    }

    .stat-num {
      font-size: 2rem;
      font-weight: 800;
      background: linear-gradient(135deg, var(--acc2), #c4b5fd);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
    }

    .stat-label { font-size: .78rem; color: var(--txt2); margin-top: 4px; }

    /* ========== NETWORK TABS ========== */
    .net-tabs {
      display: flex;
      gap: 10px;
      margin-bottom: 28px;
      flex-wrap: wrap;
    }

    .net-tab {
      padding: 11px 30px;
      border-radius: 50px;
      border: 1.5px solid var(--glass-b);
      background: var(--glass);
      color: var(--txt2);
      font-size: .95rem;
      font-weight: 600;
      cursor: pointer;
      transition: var(--tr);
      font-family: inherit;
    }
    .net-tab:hover { background: var(--glass-h); color: var(--txt); }
    .net-tab.active {
      background: linear-gradient(135deg, var(--acc), var(--acc2));
      border-color: transparent;
      color: #fff;
      box-shadow: 0 4px 18px rgba(99,102,241,0.4);
    }

    /* ========== NETWORK SECTION ========== */
    .net-section { display: none; }
    .net-section.active { display: block; animation: fadeUp .3s ease; }

    /* Etisalat sub-tabs */
    .sub-tabs {
      display: flex;
      gap: 10px;
      margin-bottom: 24px;
    }
    .sub-tab {
      padding: 9px 26px;
      border-radius: 50px;
      border: 1.5px solid var(--glass-b);
      background: var(--glass);
      color: var(--txt2);
      font-size: .9rem;
      font-weight: 600;
      cursor: pointer;
      transition: var(--tr);
      font-family: inherit;
    }
    .sub-tab:hover { background: var(--glass-h); color: var(--txt); }
    .sub-tab.active {
      background: linear-gradient(135deg, #0072ff, #00c6ff);
      border-color: transparent;
      color: #fff;
      box-shadow: 0 4px 16px rgba(0,114,255,0.35);
    }
    .sub-section { display: none; }
    .sub-section.active { display: block; animation: fadeUp .3s ease; }

    /* ========== ADMIN PACKAGE CARDS ========== */
    .admin-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 16px;
      margin-bottom: 20px;
    }

    .admin-card {
      background: var(--glass);
      border: 1.5px solid var(--glass-b);
      border-radius: var(--r);
      padding: 20px 16px 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      transition: var(--tr);
      position: relative;
    }

    .admin-card.is-hidden { opacity: 0.45; }
    .admin-card.is-suspended { border-color: rgba(245,158,11,0.45); }

    .admin-card-name {
      font-size: 1rem;
      font-weight: 700;
      color: var(--txt);
      text-align: center;
    }

    .admin-card-price {
      font-size: 1.2rem;
      font-weight: 800;
      text-align: center;
      color: var(--acc2);
    }

    .admin-card-badges {
      display: flex;
      gap: 6px;
      justify-content: center;
      flex-wrap: wrap;
      min-height: 22px;
    }

    .badge-hidden {
      background: rgba(239,68,68,0.15);
      border: 1px solid rgba(239,68,68,0.3);
      color: #fca5a5;
      font-size: .72rem;
      padding: 2px 10px;
      border-radius: 50px;
      font-weight: 600;
    }

    .badge-suspended {
      background: rgba(245,158,11,0.15);
      border: 1px solid rgba(245,158,11,0.3);
      color: #fcd34d;
      font-size: .72rem;
      padding: 2px 10px;
      border-radius: 50px;
      font-weight: 600;
    }

    .admin-ctrl-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 7px;
    }

    .ctrl-btn {
      padding: 8px 6px;
      border-radius: 8px;
      border: 1px solid var(--glass-b);
      background: var(--glass);
      color: var(--txt2);
      font-size: .78rem;
      font-weight: 600;
      cursor: pointer;
      transition: var(--tr);
      font-family: inherit;
      text-align: center;
    }
    .ctrl-btn:hover { background: var(--glass-h); color: var(--txt); transform: translateY(-1px); }
    .ctrl-btn.danger { border-color: rgba(239,68,68,0.3); color: #fca5a5; }
    .ctrl-btn.danger:hover { background: rgba(239,68,68,0.15); }
    .ctrl-btn.warn { border-color: rgba(245,158,11,0.3); color: #fcd34d; }
    .ctrl-btn.warn:hover { background: rgba(245,158,11,0.15); }
    .ctrl-btn.full { grid-column: span 2; }

    /* ========== BOTTOM BAR ========== */
    .bottom-bar {
      display: flex;
      gap: 12px;
      align-items: center;
      flex-wrap: wrap;
      margin-top: 8px;
    }

    .btn-add {
      padding: 11px 24px;
      border-radius: 50px;
      border: 1.5px dashed rgba(99,102,241,0.5);
      background: rgba(99,102,241,0.08);
      color: var(--acc2);
      font-size: .92rem;
      font-weight: 600;
      cursor: pointer;
      transition: var(--tr);
      font-family: inherit;
    }
    .btn-add:hover { background: rgba(99,102,241,0.18); border-style: solid; }

    .btn-save {
      padding: 11px 28px;
      border-radius: 50px;
      border: none;
      background: linear-gradient(135deg, var(--green), #16a34a);
      color: #fff;
      font-size: .92rem;
      font-weight: 700;
      cursor: pointer;
      transition: var(--tr);
      font-family: inherit;
      box-shadow: 0 4px 16px rgba(34,197,94,0.35);
    }
    .btn-save:hover { filter:brightness(1.1); transform:translateY(-1px); }

    .save-notice {
      font-size: .82rem;
      color: var(--green);
      font-weight: 600;
      opacity: 0;
      transition: opacity .3s;
    }
    .save-notice.show { opacity: 1; }

    /* ========== SETTINGS ========== */
    .section-head {
      font-size: 1.1rem;
      font-weight: 700;
      color: var(--txt2);
      margin: 36px 0 18px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .section-head::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--glass-b);
    }

    .settings-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      margin-bottom: 20px;
    }

    .s-field label {
      display: block;
      font-size: .82rem;
      color: var(--txt2);
      margin-bottom: 7px;
      font-weight: 500;
    }

    .s-field input {
      width: 100%;
      background: var(--glass);
      border: 1.5px solid var(--glass-b);
      border-radius: 10px;
      padding: 11px 14px;
      color: #fff;
      font-size: .95rem;
      font-family: inherit;
      outline: none;
      transition: var(--tr);
    }
    .s-field input:focus {
      border-color: var(--acc);
      box-shadow: 0 0 0 3px rgba(99,102,241,0.2);
    }

    /* ========== INLINE EDIT MODAL ========== */
    .edit-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.65);
      backdrop-filter: blur(6px);
      z-index: 9999;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .edit-overlay.open { display: flex; }

    .edit-box {
      background: #111827;
      border: 1.5px solid var(--glass-b);
      border-radius: 20px;
      padding: 30px 26px;
      width: 100%;
      max-width: 380px;
      position: relative;
      animation: fadeUp .3s cubic-bezier(.34,1.56,.64,1);
      box-shadow: 0 24px 60px rgba(0,0,0,0.5);
    }

    .edit-box h3 { font-size: 1.1rem; font-weight: 700; margin-bottom: 18px; }

    .edit-field { margin-bottom: 16px; }
    .edit-field label { display:block; font-size:.82rem; color:var(--txt2); margin-bottom:6px; }
    .edit-field input {
      width:100%;
      background: var(--glass);
      border: 1.5px solid var(--glass-b);
      border-radius: 10px;
      padding: 11px 14px;
      color: #fff;
      font-size: .95rem;
      font-family: inherit;
      outline: none;
      transition: var(--tr);
    }
    .edit-field input:focus { border-color: var(--acc); }

    .edit-actions { display:flex; gap:10px; }
    .btn-confirm {
      flex:1; padding:12px; border:none; border-radius:10px;
      background:linear-gradient(135deg,var(--acc),var(--acc2));
      color:#fff; font-size:.95rem; font-weight:700; cursor:pointer; font-family:inherit;
      transition:var(--tr);
    }
    .btn-confirm:hover { filter:brightness(1.1); }
    .btn-edcancel {
      padding:12px 20px; border:1.5px solid var(--glass-b); border-radius:10px;
      background:transparent; color:var(--txt2); font-size:.95rem; font-weight:600;
      cursor:pointer; font-family:inherit; transition:var(--tr);
    }
    .btn-edcancel:hover { background:var(--glass-h); color:#fff; }

    /* ========== RESPONSIVE ========== */
    @media (max-width: 700px) {
      .stats-grid { grid-template-columns: 1fr 1fr; }
      .settings-grid { grid-template-columns: 1fr; }
      .dash-body { padding: 20px 14px 50px; }
      .admin-grid { grid-template-columns: 1fr 1fr; }
    }
    @media (max-width: 440px) {
      .admin-grid { grid-template-columns: 1fr; }
      .stats-grid { grid-template-columns: 1fr 1fr; }
    }
  </style>
</head>
<body>

<!-- ========== LOGIN SCREEN ========== -->
<div id="loginScreen">
  <div class="login-box">
    <div class="login-icon">🔐</div>
    <h1>لوحة الإدارة</h1>
    <p>أدخل كلمة المرور للدخول</p>

    <div class="l-field">
      <label>كلمة المرور</label>
      <input type="password" id="pwdInput" placeholder="••••••••" onkeydown="if(event.key==='Enter')doLogin()" />
    </div>
    <div class="login-err" id="loginErr"></div>
    <button class="btn-login" onclick="doLogin()">دخول ←</button>
  </div>
</div>

<!-- ========== DASHBOARD ========== -->
<div id="dashboard">

  <!-- Header -->
  <div class="dash-header">
    <div class="logo">⚙️ <span>لوحة الإدارة</span></div>
    <button class="btn-logout" onclick="doLogout()">🚪 خروج</button>
  </div>

  <div class="dash-body">

    <!-- Stats -->
    <div class="stats-grid">
      <div class="stat-card">
        <div class="stat-num" id="stat-vf">0</div>
        <div class="stat-label">باقات فودافون</div>
      </div>
      <div class="stat-card">
        <div class="stat-num" id="stat-et">0</div>
        <div class="stat-label">باقات اتصالات</div>
      </div>
      <div class="stat-card">
        <div class="stat-num" id="stat-we">0</div>
        <div class="stat-label">باقات WE</div>
      </div>
      <div class="stat-card">
        <div class="stat-num" id="stat-total">0</div>
        <div class="stat-label">إجمالي الباقات</div>
      </div>
    </div>

    <!-- Network Tabs -->
    <div class="net-tabs">
      <button class="net-tab active" onclick="switchNet('vodafone')">📶 فودافون</button>
      <button class="net-tab" onclick="switchNet('etisalat')">📡 اتصالات</button>
      <button class="net-tab" onclick="switchNet('we')">🌐 WE</button>
    </div>

    <!-- ===== VODAFONE SECTION ===== -->
    <div class="net-section active" id="sec-vodafone">
      <div class="admin-grid" id="grid-vodafone"></div>
      <div class="bottom-bar">
        <button class="btn-add" onclick="addPackage('vodafone')">➕ إضافة باقة جديدة</button>
        <button class="btn-save" onclick="saveAll('vodafone')">💾 حفظ التعديلات</button>
        <span class="save-notice" id="notice-vodafone">✅ تم الحفظ</span>
      </div>
    </div>

    <!-- ===== ETISALAT SECTION ===== -->
    <div class="net-section" id="sec-etisalat">
      <div class="sub-tabs">
        <button class="sub-tab active" onclick="switchSub('mix')">المكسات</button>
        <button class="sub-tab" onclick="switchSub('net')">النت</button>
      </div>
      <div class="sub-section active" id="subsec-mix">
        <div class="admin-grid" id="grid-etisalat-mix"></div>
        <div class="bottom-bar">
          <button class="btn-add" onclick="addPackage('etisalat_mix')">➕ إضافة باقة</button>
          <button class="btn-save" onclick="saveAll('etisalat_mix')">💾 حفظ</button>
          <span class="save-notice" id="notice-etisalat_mix">✅ تم الحفظ</span>
        </div>
      </div>
      <div class="sub-section" id="subsec-net">
        <div class="admin-grid" id="grid-etisalat-net"></div>
        <div class="bottom-bar">
          <button class="btn-add" onclick="addPackage('etisalat_net')">➕ إضافة باقة</button>
          <button class="btn-save" onclick="saveAll('etisalat_net')">💾 حفظ</button>
          <span class="save-notice" id="notice-etisalat_net">✅ تم الحفظ</span>
        </div>
      </div>
    </div>

    <!-- ===== WE SECTION ===== -->
    <div class="net-section" id="sec-we">
      <div class="admin-grid" id="grid-we"></div>
      <div class="bottom-bar">
        <button class="btn-add" onclick="addPackage('we')">➕ إضافة باقة جديدة</button>
        <button class="btn-save" onclick="saveAll('we')">💾 حفظ التعديلات</button>
        <span class="save-notice" id="notice-we">✅ تم الحفظ</span>
      </div>
    </div>

    <!-- Settings -->
    <div class="section-head">إعدادات الموقع</div>
    <div class="settings-grid">
      <div class="s-field">
        <label>اسم الموقع</label>
        <input type="text" id="cfg-name" placeholder="Free Neet" />
      </div>
      <div class="s-field">
        <label>رقم واتساب</label>
        <input type="text" id="cfg-wa" placeholder="201001621853" />
      </div>
      <div class="s-field">
        <label>رابط المجموعة</label>
        <input type="text" id="cfg-group" placeholder="https://..." />
      </div>
      <div class="s-field">
        <label>شعار الموقع (رابط)</label>
        <input type="text" id="cfg-logo" placeholder="https://..." />
      </div>
    </div>
    <div class="bottom-bar" style="margin-top:0">
      <button class="btn-save" onclick="saveSettings()">💾 حفظ الإعدادات</button>
      <span class="save-notice" id="notice-settings">✅ تم حفظ الإعدادات</span>
    </div>

  </div><!-- dash-body -->
</div><!-- dashboard -->

<!-- ========== EDIT MODAL ========== -->
<div class="edit-overlay" id="editModal" onclick="closeEditIfBg(event)">
  <div class="edit-box">
    <h3 id="editTitle">تعديل الباقة</h3>
    <div class="edit-field" id="editNameWrap">
      <label>اسم الباقة</label>
      <input type="text" id="editName" />
    </div>
    <div class="edit-field" id="editPriceWrap">
      <label>السعر</label>
      <input type="text" id="editPrice" />
    </div>
    <div class="edit-field" id="editGiftWrap" style="display:none">
      <label>الهدية (للمكسات)</label>
      <input type="text" id="editGift" />
    </div>
    <div class="edit-actions">
      <button class="btn-confirm" onclick="confirmEdit()">حفظ</button>
      <button class="btn-edcancel" onclick="closeEdit()">إلغاء</button>
    </div>
  </div>
</div>

<script>
/* =========================================================
   DATA DEFAULTS
   ========================================================= */
const DEFAULTS = {
  vodafone: [
    { id:1, name:'2600 فليكس',  price:'50 جنيه',  hidden:false, suspended:false },
    { id:2, name:'5200 فليكس',  price:'90 جنيه',  hidden:false, suspended:false },
    { id:3, name:'10400 فليكس', price:'180 جنيه', hidden:false, suspended:false }
  ],
  etisalat_mix: [
    { id:1, name:'باقة 1700',  price:'1700', gift:'هدية 1700',  hidden:false, suspended:false },
    { id:2, name:'باقة 2600',  price:'2600', gift:'هدية 2600',  hidden:false, suspended:false },
    { id:3, name:'باقة 3750',  price:'3750', gift:'هدية 3750',  hidden:false, suspended:false },
    { id:4, name:'باقة 5380',  price:'5380', gift:'هدية 5380',  hidden:false, suspended:false },
    { id:5, name:'باقة 9355',  price:'9355', gift:'هدية 9355',  hidden:false, suspended:false },
    { id:6, name:'باقة 15400', price:'15400',gift:'هدية 15400', hidden:false, suspended:false }
  ],
  etisalat_net: [
    { id:1, name:'باقة النت 4750',  price:'4750',  hidden:false, suspended:false },
    { id:2, name:'باقة النت 6750',  price:'6750',  hidden:false, suspended:false },
    { id:3, name:'باقة النت 8750',  price:'8750',  hidden:false, suspended:false },
    { id:4, name:'باقة النت 11500', price:'11500', hidden:false, suspended:false },
    { id:5, name:'باقة النت 15000', price:'15000', hidden:false, suspended:false }
  ],
  we: []
};

const PASS = '405500Ma+++';
const LS   = (k) => 'fn_packages_' + k;
const LS_SETTINGS = 'fn_settings';

/* =========================================================
   LOAD / SAVE PACKAGES
   ========================================================= */
function loadPkgs(key) {
  try {
    const s = localStorage.getItem(LS(key));
    return s ? JSON.parse(s) : JSON.parse(JSON.stringify(DEFAULTS[key] || []));
  } catch { return JSON.parse(JSON.stringify(DEFAULTS[key] || [])); }
}

function savePkgs(key, data) {
  localStorage.setItem(LS(key), JSON.stringify(data));
}

/* =========================================================
   IN-MEMORY STATE
   ========================================================= */
let state = { vodafone:[], etisalat_mix:[], etisalat_net:[], we:[] };
let settings = {};

function initState() {
  state.vodafone     = loadPkgs('vodafone');
  state.etisalat_mix = loadPkgs('etisalat_mix');
  state.etisalat_net = loadPkgs('etisalat_net');
  state.we           = loadPkgs('we');
  try {
    const s = localStorage.getItem(LS_SETTINGS);
    settings = s ? JSON.parse(s) : {};
  } catch { settings = {}; }
}

/* =========================================================
   LOGIN / LOGOUT
   ========================================================= */
function doLogin() {
  const v = document.getElementById('pwdInput').value;
  if (v === PASS) {
    document.getElementById('loginScreen').style.display = 'none';
    document.getElementById('dashboard').style.display = 'block';
    initState();
    renderAll();
    loadSettingsForm();
  } else {
    const el = document.getElementById('loginErr');
    el.textContent = 'كلمة المرور غير صحيحة';
    document.getElementById('pwdInput').value = '';
    document.getElementById('pwdInput').focus();
    setTimeout(() => el.textContent = '', 2500);
  }
}

function doLogout() {
  document.getElementById('dashboard').style.display = 'none';
  document.getElementById('loginScreen').style.display = 'flex';
  document.getElementById('pwdInput').value = '';
}

/* =========================================================
   RENDER
   ========================================================= */
function renderAll() {
  renderGrid('vodafone',     document.getElementById('grid-vodafone'));
  renderGrid('etisalat_mix', document.getElementById('grid-etisalat-mix'));
  renderGrid('etisalat_net', document.getElementById('grid-etisalat-net'));
  renderGrid('we',           document.getElementById('grid-we'));
  updateStats();
}

function renderGrid(key, el) {
  const pkgs = state[key];
  el.innerHTML = '';
  if (!pkgs.length) {
    el.innerHTML = '<div style="color:var(--txt3);font-size:.9rem;padding:12px 0;">لا توجد باقات. أضف باقة جديدة.</div>';
    return;
  }
  pkgs.forEach(pkg => {
    const isMix = key === 'etisalat_mix';
    const card  = document.createElement('div');
    card.className = 'admin-card' + (pkg.hidden ? ' is-hidden' : '') + (pkg.suspended ? ' is-suspended' : '');

    const badges = [
      pkg.hidden    ? '<span class="badge-hidden">مخفي</span>' : '',
      pkg.suspended ? '<span class="badge-suspended">معلق</span>' : ''
    ].join('');

    card.innerHTML = `
      <div class="admin-card-name">${esc(pkg.name)}</div>
      ${isMix ? `<div style="font-size:.78rem;color:#6ee7b7;text-align:center">${esc(pkg.gift||'')}</div>` : ''}
      <div class="admin-card-price">${esc(pkg.price)}</div>
      <div class="admin-card-badges">${badges}</div>
      <div class="admin-ctrl-grid">
        <button class="ctrl-btn" onclick="editField('${key}',${pkg.id},'name')">✏ تعديل الاسم</button>
        <button class="ctrl-btn" onclick="editField('${key}',${pkg.id},'price')">💰 تعديل السعر</button>
        ${isMix ? `<button class="ctrl-btn" onclick="editField('${key}',${pkg.id},'gift')">🎁 تعديل الهدية</button>` : ''}
        <button class="ctrl-btn warn" onclick="toggleHide('${key}',${pkg.id})">${pkg.hidden ? '👁 إظهار' : '👁 إخفاء'}</button>
        <button class="ctrl-btn warn" onclick="toggleSuspend('${key}',${pkg.id})">${pkg.suspended ? '✅ تفعيل' : '⛔ تعليق'}</button>
        <button class="ctrl-btn danger" onclick="deletePkg('${key}',${pkg.id})">🗑 حذف</button>
      </div>
    `;
    el.appendChild(card);
  });
}

function esc(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function updateStats() {
  const vf = state.vodafone.filter(p=>!p.hidden).length;
  const et = [...state.etisalat_mix,...state.etisalat_net].filter(p=>!p.hidden).length;
  const we = state.we.filter(p=>!p.hidden).length;
  document.getElementById('stat-vf').textContent    = vf;
  document.getElementById('stat-et').textContent    = et;
  document.getElementById('stat-we').textContent    = we;
  document.getElementById('stat-total').textContent = vf + et + we;
}

/* =========================================================
   PACKAGE CONTROLS
   ========================================================= */
function toggleHide(key, id) {
  const pkg = state[key].find(p=>p.id===id);
  if (pkg) pkg.hidden = !pkg.hidden;
  renderGrid(key, document.getElementById(gridId(key)));
  updateStats();
}

function toggleSuspend(key, id) {
  const pkg = state[key].find(p=>p.id===id);
  if (pkg) pkg.suspended = !pkg.suspended;
  renderGrid(key, document.getElementById(gridId(key)));
}

function deletePkg(key, id) {
  if (!confirm('هل تريد حذف هذه الباقة؟')) return;
  state[key] = state[key].filter(p=>p.id!==id);
  renderGrid(key, document.getElementById(gridId(key)));
  updateStats();
}

function addPackage(key) {
  const isMix = key === 'etisalat_mix';
  const ids   = state[key].map(p=>p.id);
  const newId = ids.length ? Math.max(...ids) + 1 : 1;
  const pkg   = { id: newId, name: 'باقة جديدة', price: '0', hidden: false, suspended: false };
  if (isMix) pkg.gift = 'هدية';
  state[key].push(pkg);
  renderGrid(key, document.getElementById(gridId(key)));
  updateStats();
}

function gridId(key) {
  return { vodafone:'grid-vodafone', etisalat_mix:'grid-etisalat-mix', etisalat_net:'grid-etisalat-net', we:'grid-we' }[key];
}

/* =========================================================
   SAVE
   ========================================================= */
function saveAll(key) {
  savePkgs(key, state[key]);
  const n = document.getElementById('notice-' + key);
  if (n) { n.classList.add('show'); setTimeout(()=>n.classList.remove('show'), 2500); }
  updateStats();
}

/* =========================================================
   INLINE EDIT MODAL
   ========================================================= */
let editCtx = { key: null, id: null, field: null };

function editField(key, id, field) {
  editCtx = { key, id, field };
  const pkg = state[key].find(p=>p.id===id);
  if (!pkg) return;

  document.getElementById('editTitle').textContent =
    field==='name' ? 'تعديل اسم الباقة' :
    field==='price' ? 'تعديل السعر' : 'تعديل الهدية';

  document.getElementById('editNameWrap').style.display  = field==='name'  ? '' : 'none';
  document.getElementById('editPriceWrap').style.display = field==='price' ? '' : 'none';
  document.getElementById('editGiftWrap').style.display  = field==='gift'  ? '' : 'none';

  if (field==='name')  document.getElementById('editName').value  = pkg.name;
  if (field==='price') document.getElementById('editPrice').value = pkg.price;
  if (field==='gift')  document.getElementById('editGift').value  = pkg.gift || '';

  document.getElementById('editModal').classList.add('open');
  document.body.style.overflow = 'hidden';
  setTimeout(()=>{
    const inp = field==='name' ? 'editName' : field==='price' ? 'editPrice' : 'editGift';
    const el  = document.getElementById(inp);
    el.focus(); el.select();
  }, 200);
}

function confirmEdit() {
  const { key, id, field } = editCtx;
  const pkg = state[key].find(p=>p.id===id);
  if (!pkg) { closeEdit(); return; }
  if (field==='name')  pkg.name  = document.getElementById('editName').value.trim()  || pkg.name;
  if (field==='price') pkg.price = document.getElementById('editPrice').value.trim() || pkg.price;
  if (field==='gift')  pkg.gift  = document.getElementById('editGift').value.trim();
  closeEdit();
  renderGrid(key, document.getElementById(gridId(key)));
}

function closeEdit() {
  document.getElementById('editModal').classList.remove('open');
  document.body.style.overflow = '';
}

function closeEditIfBg(e) {
  if (e.target === document.getElementById('editModal')) closeEdit();
}

document.addEventListener('keydown', e => {
  if (e.key === 'Escape') closeEdit();
  if (e.key === 'Enter' && document.getElementById('editModal').classList.contains('open')) confirmEdit();
});

/* =========================================================
   SETTINGS
   ========================================================= */
function loadSettingsForm() {
  document.getElementById('cfg-name').value  = settings.siteName  || '';
  document.getElementById('cfg-wa').value    = settings.whatsapp  || '';
  document.getElementById('cfg-group').value = settings.groupLink || '';
  document.getElementById('cfg-logo').value  = settings.logo      || '';
}

function saveSettings() {
  settings.siteName  = document.getElementById('cfg-name').value.trim();
  settings.whatsapp  = document.getElementById('cfg-wa').value.trim();
  settings.groupLink = document.getElementById('cfg-group').value.trim();
  settings.logo      = document.getElementById('cfg-logo').value.trim();
  localStorage.setItem(LS_SETTINGS, JSON.stringify(settings));
  const n = document.getElementById('notice-settings');
  n.classList.add('show'); setTimeout(()=>n.classList.remove('show'), 2500);
}

/* =========================================================
   TAB SWITCHING
   ========================================================= */
function switchNet(net) {
  document.querySelectorAll('.net-tab').forEach((b,i)=>{
    b.classList.toggle('active', ['vodafone','etisalat','we'][i]===net);
  });
  ['vodafone','etisalat','we'].forEach(n=>{
    document.getElementById('sec-'+n).classList.toggle('active', n===net);
  });
}

function switchSub(sub) {
  document.querySelectorAll('.sub-tab').forEach((b,i)=>{
    b.classList.toggle('active', ['mix','net'][i]===sub);
  });
  ['mix','net'].forEach(n=>{
    document.getElementById('subsec-'+n).classList.toggle('active', n===sub);
  });
}

/* Auto-focus password input */
window.addEventListener('load', ()=>document.getElementById('pwdInput').focus());
</script>
</body>
