<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
  <title>Free Neet — لوحة الإدارة</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />

  <style>
    /* ── Reset ── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { direction: rtl; scroll-behavior: smooth; }
    body {
      font-family: 'Cairo', sans-serif;
      background: #0D0D0D;
      color: #fff;
      min-height: 100dvh;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
    }
    button, input, select, textarea {
      font-family: 'Cairo', sans-serif;
      cursor: pointer;
    }
    input, textarea { cursor: text; }

    /* ── Glow blobs ── */
    .glow-blob {
      position: fixed;
      border-radius: 50%;
      pointer-events: none;
      z-index: 0;
      filter: blur(120px);
    }

    /* ── Glassmorphism helpers ── */
    .glass {
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.08);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-radius: 1.25rem;
    }

    /* ══════════════════════════
       LOGIN SCREEN
    ══════════════════════════ */
    #login-screen {
      position: fixed;
      inset: 0;
      z-index: 500;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      background: #0D0D0D;
    }
    #login-screen.hidden { display: none; }

    .login-card {
      width: 100%;
      max-width: 420px;
      padding: 2.5rem 2rem;
      background: rgba(20,20,20,0.95);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 2rem;
      box-shadow: 0 0 80px rgba(130,0,220,0.12), 0 0 0 1px rgba(255,255,255,0.05);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      text-align: center;
    }

    /* Logo */
    .admin-logo {
      width: 100px;
      height: 100px;
      margin: 0 auto 1.25rem;
      filter: drop-shadow(0 0 24px rgba(130,0,220,0.5));
    }

    .login-title {
      font-size: 1.75rem;
      font-weight: 900;
      background: linear-gradient(135deg, #fff, #aaa);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 0.25rem;
    }
    .login-subtitle {
      font-size: 0.85rem;
      color: rgba(255,255,255,0.35);
      margin-bottom: 2rem;
    }

    .login-field {
      text-align: right;
      margin-bottom: 1.25rem;
    }
    .login-label {
      display: block;
      font-size: 0.85rem;
      font-weight: 700;
      color: rgba(255,255,255,0.65);
      margin-bottom: 0.5rem;
    }
    .login-input {
      width: 100%;
      padding: 0.9rem 1rem;
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 0.875rem;
      color: #fff;
      font-size: 1rem;
      font-family: 'Cairo', sans-serif;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
      direction: ltr;
      text-align: right;
    }
    .login-input:focus {
      border-color: rgba(130,0,220,0.6);
      box-shadow: 0 0 0 3px rgba(130,0,220,0.12);
    }
    .login-error {
      font-size: 0.8rem;
      color: #FF4444;
      margin-top: 0.4rem;
      min-height: 1.2rem;
      display: block;
    }

    .login-btn {
      width: 100%;
      padding: 1rem;
      border-radius: 1rem;
      font-size: 1.05rem;
      font-weight: 900;
      color: #fff;
      border: 1px solid rgba(130,0,220,0.5);
      background: linear-gradient(135deg, rgba(130,0,220,0.6), rgba(130,0,220,0.3));
      box-shadow: 0 4px 30px rgba(130,0,220,0.25);
      margin-top: 0.5rem;
      transition: transform 0.15s, box-shadow 0.15s;
    }
    .login-btn:hover {
      transform: scale(1.02);
      box-shadow: 0 4px 40px rgba(130,0,220,0.45);
    }
    .login-btn:active { transform: scale(0.98); }

    /* ══════════════════════════
       DASHBOARD
    ══════════════════════════ */
    #dashboard { display: none; position: relative; z-index: 1; min-height: 100dvh; }
    #dashboard.visible { display: block; }

    /* Top bar */
    .topbar {
      position: sticky;
      top: 0;
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.85rem 1.25rem;
      background: rgba(13,13,13,0.9);
      border-bottom: 1px solid rgba(255,255,255,0.07);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
    }
    .topbar-title {
      font-size: 1.1rem;
      font-weight: 900;
      background: linear-gradient(135deg,#fff,#aaa);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .topbar-actions { display: flex; gap: 0.75rem; align-items: center; }
    .topbar-home-btn {
      padding: 0.45rem 0.9rem;
      border-radius: 0.75rem;
      font-size: 0.8rem;
      font-weight: 700;
      color: rgba(255,255,255,0.6);
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.08);
      text-decoration: none;
      transition: all 0.2s;
    }
    .topbar-home-btn:hover { color: #fff; background: rgba(255,255,255,0.1); }
    .logout-btn {
      padding: 0.45rem 0.9rem;
      border-radius: 0.75rem;
      font-size: 0.8rem;
      font-weight: 700;
      color: #fff;
      background: rgba(229,0,0,0.2);
      border: 1px solid rgba(229,0,0,0.35);
      transition: all 0.2s;
    }
    .logout-btn:hover { background: rgba(229,0,0,0.35); }

    /* Dashboard content */
    .dash-content {
      max-width: 900px;
      margin: 0 auto;
      padding: 2rem 1.25rem 4rem;
    }

    /* Tab nav */
    .dash-tabs {
      display: flex;
      gap: 0.5rem;
      margin-bottom: 2rem;
      overflow-x: auto;
      padding-bottom: 0.25rem;
      scrollbar-width: none;
    }
    .dash-tabs::-webkit-scrollbar { display: none; }
    .dash-tab {
      flex-shrink: 0;
      padding: 0.6rem 1.25rem;
      border-radius: 0.875rem;
      font-size: 0.9rem;
      font-weight: 700;
      color: rgba(255,255,255,0.45);
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.07);
      transition: all 0.2s;
      white-space: nowrap;
    }
    .dash-tab.active {
      color: #fff;
      background: rgba(130,0,220,0.25);
      border-color: rgba(130,0,220,0.4);
      box-shadow: 0 0 16px rgba(130,0,220,0.15);
    }
    .dash-tab:hover:not(.active) {
      color: rgba(255,255,255,0.75);
      background: rgba(255,255,255,0.07);
    }

    /* Tab panels */
    .tab-panel { display: none; }
    .tab-panel.active { display: block; }

    /* Section card */
    .section-card {
      background: rgba(255,255,255,0.03);
      border: 1px solid rgba(255,255,255,0.07);
      border-radius: 1.25rem;
      padding: 1.5rem;
      margin-bottom: 1.5rem;
    }
    .section-card-title {
      font-size: 1.05rem;
      font-weight: 900;
      color: rgba(255,255,255,0.85);
      margin-bottom: 1.25rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    /* Package row */
    .pkg-row {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      padding: 0.75rem 0.9rem;
      background: rgba(255,255,255,0.03);
      border: 1px solid rgba(255,255,255,0.07);
      border-radius: 0.875rem;
      margin-bottom: 0.6rem;
      flex-wrap: wrap;
    }
    .pkg-row.hidden-pkg {
      opacity: 0.4;
    }
    .pkg-input {
      flex: 1;
      min-width: 100px;
      padding: 0.5rem 0.75rem;
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 0.625rem;
      color: #fff;
      font-size: 0.88rem;
      font-family: 'Cairo', sans-serif;
      outline: none;
      transition: border-color 0.2s;
    }
    .pkg-input:focus {
      border-color: rgba(130,0,220,0.5);
      box-shadow: 0 0 0 2px rgba(130,0,220,0.08);
    }
    .pkg-input.price-input { flex: 0 0 110px; }

    /* Row action buttons */
    .row-btn {
      padding: 0.45rem 0.65rem;
      border-radius: 0.6rem;
      font-size: 0.8rem;
      font-weight: 700;
      color: #fff;
      border: 1px solid transparent;
      transition: all 0.15s;
      white-space: nowrap;
    }
    .btn-hide {
      background: rgba(255,180,0,0.15);
      border-color: rgba(255,180,0,0.3);
      color: rgba(255,200,0,0.9);
    }
    .btn-hide:hover { background: rgba(255,180,0,0.28); }
    .btn-show {
      background: rgba(0,180,60,0.15);
      border-color: rgba(0,180,60,0.3);
      color: rgba(0,220,80,0.9);
    }
    .btn-show:hover { background: rgba(0,180,60,0.28); }
    .btn-delete {
      background: rgba(229,0,0,0.15);
      border-color: rgba(229,0,0,0.3);
      color: rgba(255,80,80,0.9);
    }
    .btn-delete:hover { background: rgba(229,0,0,0.3); }

    /* Add package button */
    .add-pkg-btn {
      width: 100%;
      padding: 0.75rem;
      border-radius: 0.875rem;
      font-size: 0.9rem;
      font-weight: 700;
      color: rgba(255,255,255,0.6);
      background: rgba(255,255,255,0.03);
      border: 1px dashed rgba(255,255,255,0.12);
      margin-top: 0.5rem;
      transition: all 0.2s;
    }
    .add-pkg-btn:hover {
      color: #fff;
      border-color: rgba(130,0,220,0.4);
      background: rgba(130,0,220,0.08);
    }

    /* Settings */
    .settings-field { margin-bottom: 1.25rem; }
    .settings-label {
      display: block;
      font-size: 0.85rem;
      font-weight: 700;
      color: rgba(255,255,255,0.6);
      margin-bottom: 0.5rem;
    }
    .settings-input {
      width: 100%;
      padding: 0.8rem 1rem;
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 0.875rem;
      color: #fff;
      font-size: 0.95rem;
      font-family: 'Cairo', sans-serif;
      outline: none;
      transition: border-color 0.2s;
      direction: ltr;
      text-align: right;
    }
    .settings-input:focus {
      border-color: rgba(130,0,220,0.5);
      box-shadow: 0 0 0 3px rgba(130,0,220,0.08);
    }

    /* Subtab (for etisalat mix/net) */
    .subtab-bar {
      display: flex;
      gap: 0.5rem;
      margin-bottom: 1rem;
      background: rgba(255,255,255,0.03);
      border: 1px solid rgba(255,255,255,0.07);
      border-radius: 0.875rem;
      padding: 0.3rem;
    }
    .subtab-btn {
      flex: 1;
      padding: 0.55rem;
      border-radius: 0.625rem;
      font-size: 0.875rem;
      font-weight: 700;
      color: rgba(255,255,255,0.4);
      background: transparent;
      border: none;
      transition: all 0.2s;
    }
    .subtab-btn.active {
      color: #fff;
      background: rgba(0,180,60,0.25);
      border: 1px solid rgba(0,180,60,0.35);
    }

    /* Save button */
    .save-btn-wrap {
      position: sticky;
      bottom: 1.5rem;
      margin-top: 1.5rem;
      display: flex;
      justify-content: center;
    }
    .save-btn {
      padding: 1rem 3rem;
      border-radius: 1.25rem;
      font-size: 1.1rem;
      font-weight: 900;
      color: #fff;
      background: linear-gradient(135deg, rgba(37,211,102,0.55), rgba(37,211,102,0.28));
      border: 1px solid rgba(37,211,102,0.5);
      box-shadow: 0 4px 30px rgba(37,211,102,0.25);
      transition: transform 0.15s, box-shadow 0.15s;
    }
    .save-btn:hover {
      transform: scale(1.04);
      box-shadow: 0 4px 50px rgba(37,211,102,0.45);
    }
    .save-btn:active { transform: scale(0.98); }

    /* Toast */
    .toast {
      position: fixed;
      bottom: 2rem;
      left: 50%;
      transform: translateX(-50%) translateY(200%);
      background: rgba(30,30,30,0.95);
      border: 1px solid rgba(37,211,102,0.4);
      color: #fff;
      font-weight: 700;
      padding: 0.85rem 1.75rem;
      border-radius: 1rem;
      z-index: 9999;
      font-size: 0.95rem;
      box-shadow: 0 8px 40px rgba(0,0,0,0.4);
      transition: transform 0.35s cubic-bezier(0.16,1,0.3,1);
      white-space: nowrap;
    }
    .toast.show { transform: translateX(-50%) translateY(0); }

    /* Logo preview */
    .logo-preview {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      object-fit: cover;
      background: rgba(255,255,255,0.05);
      border: 2px solid rgba(130,0,220,0.3);
      display: flex;
      align-items: center;
      justify-content: center;
      color: rgba(255,255,255,0.3);
      font-size: 0.75rem;
      margin-bottom: 0.75rem;
      overflow: hidden;
    }
    .logo-preview img { width: 100%; height: 100%; object-fit: cover; }

    /* Animations */
    @keyframes fadeIn { from { opacity:0; transform:translateY(8px); } to { opacity:1; transform:translateY(0); } }
    .fade-in { animation: fadeIn 0.4s ease forwards; }
  </style>
</head>
<body>

  <!-- Glow blobs -->
  <div class="glow-blob" style="top:-10%;right:-10%;width:50vw;height:50vw;background:#8200DC;opacity:0.06;"></div>
  <div class="glow-blob" style="bottom:-10%;left:-10%;width:40vw;height:40vw;background:#8200DC;opacity:0.04;"></div>

  <!-- Toast -->
  <div id="toast" class="toast">💾 تم حفظ التعديلات بنجاح!</div>

  <!-- ══════════════════════
       LOGIN SCREEN
  ══════════════════════ -->
  <div id="login-screen">
    <div class="login-card">

      <!-- Logo -->
      <svg class="admin-logo" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="lg" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#E50000"/>

          <linearGradient id="rg" x1="100%" y1="0%" x2="0%" y2="100%">

        <g transform="translate(60,75)">
          <path d="M15 60 L15 0 L45 0 L45 12 L28 12 L28 25 L40 25 L40 37 L28 37 L28 60 Z" fill="url(#lg)"/>
          <path d="M50 60 L50 0 L63 0 L80 40 L80 0 L92 0 L92 60 L79 60 L62 20 L62 60 Z" fill="url(#lg)"/>

      </svg>

      <h1 class="login-title">🔒 لوحة الإدارة</h1>
      <p class="login-subtitle">الرجاء إدخال كلمة المرور</p>

      <form id="login-form" onsubmit="doLogin(event)" novalidate>

        <div class="login-field">
          <label class="login-label" for="l-pass">كلمة المرور</label>
          <input id="l-pass" type="password" class="login-input" placeholder="••••••••" autocomplete="current-password" />
        </div>

        <span id="login-error" class="login-error"></span>

        <button type="submit" class="login-btn">
          <i class="fa-solid fa-right-to-bracket" style="margin-left:0.5rem;"></i>
          دخول
        </button>

      </form>
    </div>
  </div>


  <!-- ══════════════════════
       DASHBOARD
  ══════════════════════ -->
  <div id="dashboard">

    <!-- Top bar -->
    <div class="topbar">
      <span class="topbar-title">🛠 لوحة الإدارة — Free Neet</span>
      <div class="topbar-actions">
        <a href="index.html" class="topbar-home-btn">
          <i class="fa-solid fa-house" style="margin-left:0.3rem;"></i>

        </a>
        <button class="logout-btn" onclick="doLogout()">
          🚪 تسجيل الخروج
        </button>
      </div>
    </div>

    <!-- Content -->
    <div class="dash-content">

      <!-- Tab nav -->
      <div class="dash-tabs">
        <button class="dash-tab active" onclick="switchTab('vf',this)">📱 فودافون</button>
        <button class="dash-tab" onclick="switchTab('et',this)">📞 اتصالات</button>
        <button class="dash-tab" onclick="switchTab('we',this)">🌐 WE</button>
        <button class="dash-tab" onclick="switchTab('settings',this)">⚙ إعدادات</button>
      </div>

      <!-- ─── Vodafone Tab ─── -->
      <div id="tab-vf" class="tab-panel active">
        <div class="section-card">
          <p class="section-card-title">🔴 باقات فودافون — فليكس فاميلي</p>
          <div id="vf-packages"></div>
          <button class="add-pkg-btn" onclick="addPackage('vf')">➕ إضافة باقة</button>
        </div>
      </div>

      <!-- ─── Etisalat Tab ─── -->
      <div id="tab-et" class="tab-panel">
        <div class="section-card">
          <p class="section-card-title">🟢 باقات اتصالات</p>
          <div class="subtab-bar">
            <button class="subtab-btn active" id="et-sub-mix-btn" onclick="switchEtSubTab('mix')">المكسات</button>
            <button class="subtab-btn" id="et-sub-net-btn" onclick="switchEtSubTab('net')">الإنترنت</button>
          </div>
          <div id="et-mix-packages"></div>
          <div id="et-net-packages" style="display:none;"></div>
          <button class="add-pkg-btn" onclick="addEtPackage()" id="et-add-btn">➕ إضافة باقة</button>
        </div>
      </div>

      <!-- ─── WE Tab ─── -->
      <div id="tab-we" class="tab-panel">
        <div class="section-card">
          <p class="section-card-title">🟣 باقات WE</p>
          <div id="we-packages"></div>
          <button class="add-pkg-btn" onclick="addPackage('we')">➕ إضافة باقة</button>
        </div>
      </div>

      <!-- ─── Settings Tab ─── -->
      <div id="tab-settings" class="tab-panel fade-in">
        <div class="section-card">
          <p class="section-card-title">⚙ إعدادات الموقع</p>

          <div class="settings-field">
            <label class="settings-label">📱 رقم الواتساب</label>
            <input id="s-whatsapp" type="tel" class="settings-input" placeholder="201001621853" />
          </div>

          <div class="settings-field">
            <label class="settings-label">🔗 لينك الجروب</label>
            <input id="s-group" type="url" class="settings-input" placeholder="https://chat.whatsapp.com/..." />
          </div>

          <div class="settings-field">
            <label class="settings-label">🏷 اسم الموقع</label>
            <input id="s-sitename" type="text" class="settings-input" placeholder="Free Neet" />
          </div>

          <div class="settings-field">
            <label class="settings-label">🖼 رابط اللوجو (URL)</label>
            <input id="s-logo" type="url" class="settings-input" placeholder="https://..." oninput="previewLogo(this.value)" />
            <div class="logo-preview" id="logo-preview-box" style="margin-top:0.75rem;">
              <i class="fa-solid fa-image" style="font-size:1.5rem;color:rgba(255,255,255,0.2);"></i>
            </div>
          </div>
        </div>
      </div>

      <!-- Save button -->
      <div class="save-btn-wrap">
        <button class="save-btn" onclick="saveAll()">
          💾 حفظ التعديلات
        </button>
      </div>

    </div><!-- /.dash-content -->
  </div><!-- /#dashboard -->

  /* ════════════════════════════════
     LOAD / SAVE DATA (localStorage)
  ════════════════════════════════ */
  function loadData() {
    try {
      var saved = localStorage.getItem('fn_admin_data');
      return saved ? JSON.parse(saved) : JSON.parse(JSON.stringify(DEFAULT_DATA));
    } catch (e) {
      return JSON.parse(JSON.stringify(DEFAULT_DATA));
    }
  }

  function saveData(data) {
    localStorage.setItem('fn_admin_data', JSON.stringify(data));
  }

  /* Current working copy */
  var DATA = loadData();

  /* ════════════════════════════════
     LOGIN
  ════════════════════════════════ */
  function doLogin(e) {
    e.preventDefault();
    var pass  = document.getElementById('l-pass').value;
    var errEl = document.getElementById('login-error');

    if (pass === ADMIN_PASS) {
      errEl.textContent = '';
      document.getElementById('login-screen').classList.add('hidden');
      var dash = document.getElementById('dashboard');
      dash.classList.add('visible');
      initDashboard();
    } else {
      errEl.textContent = '❌ كلمة المرور غير صحيحة';
      var passInput = document.getElementById('l-pass');
      passInput.value = '';
      passInput.focus();
    }
  }

  function doLogout() {
    document.getElementById('dashboard').classList.remove('visible');
    document.getElementById('login-screen').classList.remove('hidden');
    document.getElementById('l-pass').value = '';
    document.getElementById('login-error').textContent = '';
  }

  /* ════════════════════════════════
     DASHBOARD INIT
  ════════════════════════════════ */
  function initDashboard() {
    renderPackages('vf', 'vf-packages');
    renderPackages('etMix', 'et-mix-packages');
    renderPackages('etNet', 'et-net-packages');
    renderPackages('we', 'we-packages');
    loadSettings();
  }

  /* ════════════════════════════════
     TAB SWITCHING
  ════════════════════════════════ */
  function switchTab(id, btn) {
    document.querySelectorAll('.tab-panel').forEach(function(p) { p.classList.remove('active'); });
    document.querySelectorAll('.dash-tab').forEach(function(b) { b.classList.remove('active'); });
    document.getElementById('tab-' + id).classList.add('active');
    btn.classList.add('active');
  }

  var currentEtSubTab = 'mix';

  function switchEtSubTab(type) {
    currentEtSubTab = type;
    document.getElementById('et-mix-packages').style.display = type === 'mix' ? 'block' : 'none';
    document.getElementById('et-net-packages').style.display = type === 'net' ? 'block' : 'none';
    document.getElementById('et-sub-mix-btn').classList.toggle('active', type === 'mix');
    document.getElementById('et-sub-net-btn').classList.toggle('active', type === 'net');
  }

  /* ════════════════════════════════
     RENDER PACKAGES
  ════════════════════════════════ */
  function renderPackages(key, containerId) {
    var container = document.getElementById(containerId);
    container.innerHTML = '';
    var list = DATA[key];
    list.forEach(function(pkg, i) {
      var row = document.createElement('div');
      row.className = 'pkg-row' + (pkg.visible ? '' : ' hidden-pkg');
      row.dataset.key = key;
      row.dataset.idx = i;

      var nameInput = document.createElement('input');
      nameInput.type = 'text';
      nameInput.className = 'pkg-input';
      nameInput.value = pkg.name;
      nameInput.placeholder = 'اسم الباقة';
      nameInput.oninput = function() { DATA[key][i].name = this.value; };

      var priceInput = document.createElement('input');
      priceInput.type = 'text';
      priceInput.className = 'pkg-input price-input';
      priceInput.value = pkg.price;
      priceInput.placeholder = 'السعر';
      priceInput.oninput = function() { DATA[key][i].price = this.value; };

      var hideBtn = document.createElement('button');
      if (pkg.visible) {
        hideBtn.className = 'row-btn btn-hide';
        hideBtn.textContent = '👁 إخفاء';
        hideBtn.onclick = function() { DATA[key][i].visible = false; renderPackages(key, containerId); };
      } else {
        hideBtn.className = 'row-btn btn-show';
        hideBtn.textContent = '👁 إظهار';
        hideBtn.onclick = function() { DATA[key][i].visible = true; renderPackages(key, containerId); };
      }

      var delBtn = document.createElement('button');
      delBtn.className = 'row-btn btn-delete';
      delBtn.textContent = '🗑 حذف';
      delBtn.onclick = function() {
        if (confirm('هل تريد حذف هذه الباقة؟')) {
          DATA[key].splice(i, 1);
          renderPackages(key, containerId);
        }
      };

      row.appendChild(nameInput);
      row.appendChild(priceInput);
      row.appendChild(hideBtn);
      row.appendChild(delBtn);
      container.appendChild(row);
    });
  }

  /* ════════════════════════════════
     ADD PACKAGE
  ════════════════════════════════ */
  function addPackage(key) {
    var containerMap = { vf: 'vf-packages', we: 'we-packages' };
    DATA[key].push({ name: 'باقة جديدة', price: '0 جنيه', visible: true });
    renderPackages(key, containerMap[key]);
    /* scroll to bottom of container */
    var c = document.getElementById(containerMap[key]);
    var rows = c.querySelectorAll('.pkg-row');
    if (rows.length) rows[rows.length - 1].querySelector('input').focus();
  }

  function addEtPackage() {
    var key = currentEtSubTab === 'mix' ? 'etMix' : 'etNet';
    var containerId = currentEtSubTab === 'mix' ? 'et-mix-packages' : 'et-net-packages';
    DATA[key].push({ name: 'باقة جديدة', price: '0 جنيه', visible: true });
    renderPackages(key, containerId);
    var c = document.getElementById(containerId);
    var rows = c.querySelectorAll('.pkg-row');
    if (rows.length) rows[rows.length - 1].querySelector('input').focus();
  }

  /* ════════════════════════════════
     SETTINGS
  ════════════════════════════════ */
  function loadSettings() {
    var s = DATA.settings;
    document.getElementById('s-whatsapp').value = s.whatsapp || '';
    document.getElementById('s-group').value    = s.group    || '';
    document.getElementById('s-sitename').value = s.siteName || '';
    document.getElementById('s-logo').value     = s.logo     || '';
    if (s.logo) previewLogo(s.logo);
  }

  function previewLogo(url) {
    var box = document.getElementById('logo-preview-box');
    if (url) {
      box.innerHTML = '<img src="' + url + '" alt="لوجو" onerror="this.style.display=\'none\'">';
    } else {
      box.innerHTML = '<i class="fa-solid fa-image" style="font-size:1.5rem;color:rgba(255,255,255,0.2);"></i>';
    }
  }

  function collectSettings() {
    DATA.settings.whatsapp = document.getElementById('s-whatsapp').value.trim();
    DATA.settings.group    = document.getElementById('s-group').value.trim();
    DATA.settings.siteName = document.getElementById('s-sitename').value.trim();
    DATA.settings.logo     = document.getElementById('s-logo').value.trim();
  }

  /* ════════════════════════════════
     SAVE ALL
  ════════════════════════════════ */
  function saveAll() {
    collectSettings();
    saveData(DATA);
    showToast('💾 تم حفظ التعديلات بنجاح!');
  }

  function showToast(msg) {
    var t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    setTimeout(function() { t.classList.remove('show'); }, 3000);
  }
  </script>
